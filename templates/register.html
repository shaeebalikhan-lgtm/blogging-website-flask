{% extends "main.html" %}
{% block title %}
<title> Register </title>
{% endblock title %}

{% block body %}
<h1 class='text-center'>Register page</h1>
<div class="container">
<form class='my-4' method='POST' action='/register'> <!--margin y axis-4unit register post the data to/register-->
  <div class="row">
    <div class="col-md-6 mb-6">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input type="email" class="form-control" placeholder = 'Email' name= 'email' id="exampleInputEmail1" aria-describedby="emailHelp">
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
    </div>
    <div class="col-md-6 mb-6">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input type="password" class="form-control" placeholder='Password' name= 'password'id="exampleInputPassword1">
    </div>
  </div>
  <div class="col-md-12 mb-3">
        <label for="exampleInputPassword1" class="form-label">First Name</label>
        <input type="text" class="form-control" placeholder = "First Name"name= 'fname' id="exampleInputPassword1">
   </div>
   <div class="col-md-12 mb-3">
        <label for="exampleInputPassword1" class="form-label">Last Name</label>
        <input type="text" class="form-control" placeholder = "Last Name"name= 'lname' id="exampleInputPassword1">
   </div>

    <div class="col-md-12 mb-3">
        <label for="exampleInputPassword1" class="form-label">Username</label>
        <input type="text" class="form-control" placeholder = "Username" name='uname' id="exampleInputPassword1">
   </div>
  
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary">Sign in</button>
</form>
</div>
{% endblock body %}
